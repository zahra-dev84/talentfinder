<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./src/style.css">


    <title>Skill Finder</title>


</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-3xl bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden">

        <!-- Header -->

        <
        <!-- Content -->

        <div class="p-8">

            <!-- Progress -->

            <div class="flex justify-between mb-3">

                <span class="text-slate-300">

                    سوال

                    <span id="currentQuestion">

                        1

                    </span>

                    از

                    <span id="totalQuestion">

                        31

                    </span>

                </span>

                <span class="text-orange-400">

                    0%

                </span>

            </div>

            <div class="w-full h-3 rounded-full bg-slate-700">

                <div class="bg-orange-500 h-3 rounded-full transition-all duration-500" style="width:0%;"
                    id="progressBar">

                </div>

            </div>

            <!-- Question -->

            <div class="mt-10">

                <h2 id="question" class="text-2xl font-bold text-white leading-loose">



                </h2>

            </div>

            <!-- Answers -->

            <div id="answers" class="mt-10 grid gap-4">

            </div>

            <!-- Buttons -->

            <div class="flex justify-between mt-10">

                <button id="prevBtn" class="px-8 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-white transition">

                    قبلی

                </button>

                <button id="nextBtn"
                    class="px-8 py-3 rounded-xl bg-orange-500 hover:bg-orange-400 text-white transition">

                    بعدی

                </button>

            </div>

        </div>

    </div>
    <script src="./js/question.js"></script>
